name: Rinkimas

# Tik parsiunčia, ką nurodo serveris (fetcher/fetch.py, leidžia tik *.vinted.*).
# Vienas paleidimas = viena SSH sesija (~10 min.), be ciklo – kas paleidimas naujas runner'is.
# Kas valandą ~54 min. darbas, serveris kviečiamas kas 5 min. (GitHub dažnų cron'ų nevykdo – 11-05 iš
# „kas 10 min.“ per 40 min. įvyko 1). Ką rinkti (ar nieko) ir ribas sprendžia serveris (vinted/eu_pace.py).
on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Kiek minučių kartoti"
        default: "54"
      every:
        description: "Kas kiek sekundžių"
        default: "300"

concurrency:
  group: eu-rinka
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: fetcher

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Įdiegti
        run: pip install -q "curl_cffi>=0.16,<0.17"

      - name: Ryšys
        env:
          KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/server && chmod 600 ~/.ssh/server
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts

      - name: Rinkti
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          MINUTES: ${{ inputs.minutes || '54' }}
          EVERY: ${{ inputs.every || '300' }}
        run: |
          end=$(( $(date +%s) + MINUTES * 60 ))
          while :; do
            began=$(date +%s)
            out=$(python fetcher/fetch.py ssh -T -i ~/.ssh/server -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o LogLevel=ERROR -o ServerAliveInterval=30 "deal@$HOST" 2>/dev/null) || true
            echo "$(date -u '+%H:%M UTC'): $(echo "$out" | grep -oE '^gauta [0-9]+' || echo 'gauta 0')"
            next=$(( began + EVERY ))
            [ "$next" -ge "$end" ] && break
            now=$(date +%s); [ "$next" -gt "$now" ] && sleep $(( next - now ))
          done
